name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev,ml]"

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --no-cache-dir --wheel-dir dist
